<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a56db">
  <meta name="description" content="Kahramanmaraş Okul Teknoloji Altyapı Takip Sistemi">
  <title>K.Maraş Okul Envanteri</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
        </div>
        <div>
          <div class="header-title">K.Maraş Okul Envanteri</div>
          <div class="header-sub">YEĞİTEK Teknoloji Takip</div>
        </div>
      </div>
      <div class="header-right">
        <button class="btn-anasayfa" id="btnAnasayfa" onclick="setPage('okul')">🏠 Ana Sayfa</button>
        <button class="btn-ghost" id="btnIstat" onclick="setPage('istat')">📊 İstatistik</button>
        <button class="btn-primary" onclick="openAddModal()">+ Ekle</button>
      </div>
    </header>

    <!-- TOP STATS -->
    <div class="top-stats" id="topStats"></div>

    <!-- PAGES -->
    <div class="page" id="pageOkul">
      <div class="search-bar card">
        <div class="field-group">
          <label class="lbl">İlçe Seçin</label>
          <select id="selIlce">
            <option value="">-- İlçe seçin --</option>
            <option>Afşin</option><option>Andırın</option><option>Çağlayancerit</option>
            <option>Dulkadiroğlu</option><option>Ekinözü</option><option>Elbistan</option>
            <option>Göksun</option><option>Merkez (Onikişubat)</option><option>Nurhak</option>
            <option>Pazarcık</option><option>Türkoğlu</option>
          </select>
        </div>
        <button class="btn-primary listele-btn" onclick="listele()">Listele</button>
      </div>

      <div id="listPanel" style="display:none">
        <div class="list-info" id="listInfo"></div>
        <div id="okulListesi"></div>
      </div>

      <div id="detailPanel" style="display:none"></div>
    </div>

    <div class="page" id="pageIstat" style="display:none">
      <div class="istat-header">
        <button class="btn-ghost" onclick="setPage('okul')">← Geri</button>
        <h2>İstatistik Raporu</h2>
        <button class="btn-orange" onclick="pdfIndir()">⬇ PDF</button>
      </div>
      <div id="istatContent"></div>
    </div>
  </div>

  <!-- ADD/EDIT MODAL -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Yeni Okul Ekle</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
